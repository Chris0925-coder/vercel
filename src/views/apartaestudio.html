<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title><%=title%></title>

    <link
      rel="stylesheet"
      type="text/css"
      media="screen"
      href="/styles/apartaestudio.css"
    />

    <!-- <script src="/scripts/cookies.js" defer></script> -->

    <!-- <script src="/scripts/apartaestudio.js" defer></script> -->

    <!-- <link rel="favicon" href="" /> -->
    <!-- <link rel="icon" type="image/x-icon" href="favicon.ico" sizes="any" /> -->
  </head>
  <body>
    <header>
      <nav>
        <ul>
          <!-- <li><a href="/home">Home</a></li> -->
          <!-- <li><a href="/upload">Upload</a></li> -->
          <!-- <li><a href="./register.html">Register</a></li> -->
        </ul>
      </nav>
    </header>
    <h1>APARTAESTUDIO</h1>

    <% tab.forEach((data) => { %>

    <div class="tabla-scroll" tabindex="0">
      <table class="tabla-mensajes">
        <tr>
          <th>Nombre</th>
          <th>Telefono</th>
          <th>E-mail</th>
          <th>Comentario</th>
          <th>Fecha</th>
          <th>Cédula</th>
          <th>Referencias</th>
        </tr>
        <tr>
          <td><%=data.fullname%></td>
          <td><%=data.phone%></td>
          <td><%=data.mail%></td>
          <td><%=data.comentarios%></td>
          <td><%=data.fecha%></td>
          <td>
            <img
              src="https://qjsvnfogbaqnjbqi.public.blob.vercel-storage.com/apartaestudio/<%=data.cedula%>"
              width="100"
              height="100"
            />
          </td>
          <td>
            <img
              src="https://qjsvnfogbaqnjbqi.public.blob.vercel-storage.com/apartaestudio/<%=data.referencia%>"
              width="100"
              height="100"
            />
          </td>
        </tr>
      </table>
    </div>

    <% }) %>

    <br />
    <hr />
  </body>
</html>
